name: Container

on:
  pull_request:
    paths:
      [
        "Dockerfile",
        ".dockerignore",
        "src/**",
        "package.json",
        "pnpm-lock.yaml",
        "pnpm-workspace.yaml",
        "tsconfig*.json",
        ".github/workflows/container.yml",
      ]
  # Publishing happens only when release.yml calls this workflow (after its gates). There is no
  # tag-push trigger: anyone able to push a tag could otherwise publish a signed image.
  workflow_call:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # BuildKit, pinned by digest (setup-buildx would otherwise pull a mutable tag). Update by hand:
  # pick a moby/buildkit release at least 14 days old and copy its index digest from Docker Hub.
  BUILDKIT_IMAGE: moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
  TRIVY_VERSION: "0.70.0"

jobs:
  # Pull requests: build and scan each architecture on its own native runner (nothing is pushed).
  scan:
    name: scan (${{ matrix.arch }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            trivy: Linux-64bit
            trivy_sha256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
          - arch: arm64
            runner: ubuntu-24.04-arm
            trivy: Linux-ARM64
            trivy_sha256: 2f6bb988b553a1bbac6bdd1ce890f5e412439564e17522b88a4541b4f364fc8d
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: nz-legislation-mcp:scan
      # Install Trivy from its GitHub release, checked against a pinned SHA-256, instead of the
      # action's installer (which downloads from get.trivy.dev; that host stopped resolving on 4 Nov 2026).
      - name: Install Trivy (pinned, checksum verified)
        env:
          TRIVY_ASSET: ${{ matrix.trivy }}
          TRIVY_SHA256: ${{ matrix.trivy_sha256 }}
        run: |
          tarball="trivy_${TRIVY_VERSION}_${TRIVY_ASSET}.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$tarball"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      - name: Scan image (fail on fixable high or critical vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: nz-legislation-mcp:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy.sarif
      - if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.arch }}

  # Release: each architecture is built on its own native runner (no emulator), scanned, then
  # pushed by digest only (no tag) with an SBOM and provenance. `merge` tags and signs the
  # multi-architecture image once both are in.
  build:
    name: build (${{ matrix.arch }})
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            trivy: Linux-64bit
            trivy_sha256: 8b4376d5d6befe5c24d503f10ff136d9e0c49f9127a4279fd110b727929a5aa9
          - arch: arm64
            runner: ubuntu-24.04-arm
            trivy: Linux-ARM64
            trivy_sha256: 2f6bb988b553a1bbac6bdd1ce890f5e412439564e17522b88a4541b4f364fc8d
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    # Publishing waits out the "release" environment's 30-minute timer (the cancel window).
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - name: Build for scanning (not pushed)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: nz-legislation-mcp:release-scan
      - name: Install Trivy (pinned, checksum verified)
        env:
          TRIVY_ASSET: ${{ matrix.trivy }}
          TRIVY_SHA256: ${{ matrix.trivy_sha256 }}
        run: |
          tarball="trivy_${TRIVY_VERSION}_${TRIVY_ASSET}.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$tarball"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      - name: Scan before publishing (fail on fixable high or critical vulnerabilities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          image-ref: nz-legislation-mcp:release-scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # Registry login only after the scan, so the scanner never runs with credentials on disk.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same semver tags as `merge` (not applied here): they set the version label.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
      - id: build
        name: Push by digest (no tag yet)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
      - name: Record the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Not a digest: $DIGEST" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
          echo "linux/$ARCH image: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 7
          # A re-run of a failed leg replaces its earlier digest file (merge checks the count).
          overwrite: true

  # Tag the multi-architecture image (both digests) and sign it, keyless, by digest.
  merge:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }}
          # "latest" is added automatically for non-prerelease versions (flavor latest=auto).
      - id: merge
        name: Create the multi-architecture image
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          digests=(*)
          [[ ${#digests[@]} -eq 2 ]] || { echo "Expected 2 digests, found ${#digests[@]}" >&2; exit 1; }
          sources=()
          for d in "${digests[@]}"; do
            [[ "$d" =~ ^[0-9a-f]{64}$ ]] || { echo "Not a digest: $d" >&2; exit 1; }
            sources+=("$IMAGE@sha256:$d")
          done
          tags=()
          while IFS= read -r tag; do [[ -n "$tag" ]] && tags+=(-t "$tag"); done <<< "$TAGS"
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          digest="$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Not a digest: $digest" >&2; exit 1; }
          # The tag was read back above, so check the index it points to holds exactly our two
          # builds (their platform and attestation manifests) before signing it: if the tag had
          # been moved in between, the project identity would otherwise sign someone else's image.
          children() {
            docker buildx imagetools inspect --raw "$1" \
              | jq -r --arg self "${1#*@}" 'if .manifests then .manifests[].digest else $self end'
          }
          expected="$(for s in "${sources[@]}"; do children "$s"; done | LC_ALL=C sort)"
          actual="$(children "$IMAGE@$digest" | LC_ALL=C sort)"
          [[ -n "$expected" && "$expected" == "$actual" ]] || {
            echo "The tagged index does not match the images just built; not signing." >&2
            exit 1
          }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Multi-architecture image: $IMAGE@$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      # --recursive also signs each platform image in the index.
      - name: Sign the image (keyless, by digest)
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: cosign sign --yes --recursive "${IMAGE}@${DIGEST}"
